# ===========================================
# LOGISTICS PIPELINE CONFIGURATION
# ===========================================

paths:
  input_dir: "data/input"
  output_dir: "data/output"
  reference_dir: "data/reference"
  master_excel: "data/input/master_accounts.xlsx"
  master_json: "data/reference/master_list_json.json"
  match_history: "data/reference/match_history.json"
  audit_log: "data/output/pipeline_audit.json"

thresholds:
  vector_quality_threshold: 0.3
  min_name_length: 4
  vector_k_candidates: 3
  embedding_model: "all-MiniLM-L6-v2"

llm:
  provider: "gemini"
  gemini:
    model_name: "gemini-3.6-flash"
    batch_size: 5
  ollama:
    model_name: "deepseek-v4-flash"
    host: "https://ollama.com"
  temperature: 0

business_logic:
  suffix_words:
    - "LIMITED"
    - "LTD"
    - "PLC"
    - "NIGERIA"
    - "COMPANY"
    - "INTERNATIONAL"
    - "INDUSTRIES"
    - "SL"
    - "INC"
    - "VENTURES"
    - "VENTURE"
    - "VENT"
    - "ENTERPRISES"
    - "ENTERPRISE"
    - "ENT"
  junk_patterns:
    - "TO ORDER"
    - "NULL"
    - "UNKNOWN"
    - "AS PER"
    - "BANK"
    - "LOC"
    - "SAME AS"
    - "SAME AS NOTIFY"
    - "SAME AS NOTIFY PARTY"
  bank_keywords:
    - "TO THE ORDER OF BANK OF "
    - "TO THE ORDER OF "
    - "TO ORDER OF "
    - "ORDER OF "
    - "BANK"
    - "L/C"
    - "LETTER OF CREDIT"
    - "FINANCE"
